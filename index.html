<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Contas</title>

  <style>
    body {
      font-family: "Courier New", monospace;
      background: #fdfdfd;
      color: #000;
      padding: 15px;
      max-width: 400px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    input,
    select,
    button {
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      font-family: "Courier New", monospace;
      font-size: 16px;
      border: 1px solid #000;
      background: #fff;
      box-sizing: border-box;
      display: block;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      border-radius: 0;
      outline: none;
    }

    button {
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      background: #000;
      color: #fff;
    }

    #copiarBtn {
      width: auto;
      padding: 8px 12px;
      font-size: 14px;
      margin-top: 5px;
      text-transform: none;
      background: #fff;
      color: #000;
    }

    #lista {
      margin-top: 15px;
      font-size: 14px;
    }

    .dia {
      margin-top: 15px;
      font-weight: bold;
    }

    .item-gasto {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .desc {
      font-style: italic;
      color: #555;
    }

    .btn-remover {
      color: #ccc;
      cursor: pointer;
      font-size: 18px;
      padding-left: 10px;
      user-select: none;
    }

    .btn-remover:hover {
      color: #000;
    }

    #resultado {
      margin-top: 15px;
      border-top: 1px dashed #000;
      padding-top: 10px;
      padding-bottom: 60px;
      font-size: 14px;
      white-space: pre-line;
      line-height: 1.5;
    }

    .btn-limpar {
      background: #fff0f0;
      color: #800;
      border-color: #800;
    }
  </style>
</head>

<body>

  <h1>DIVISÃO DE CONTAS</h1>

  <input type="number" id="valor" placeholder="Valor" inputmode="decimal">
  <input type="text" id="local" placeholder="Descrição (opcional)">

  <select id="pagador">
    <option value="Michael">Michael</option>
    <option value="Steffany">Steffany</option>
  </select>

  <button onclick="adicionar()">Adicionar</button>
  <button class="btn-limpar" onclick="limparTudo()">Limpar Dados</button>

  <button id="copiarBtn" onclick="copiar()">Copiar extrato</button>

  <div id="lista"></div>
  <div id="resultado"></div>

  <script>
    let gastos = [];

    window.onload = () => {
      const dadosSalvos = localStorage.getItem('meusGastos');
      if (dadosSalvos) {
        gastos = JSON.parse(dadosSalvos);
        gastos.forEach(g => g.data = new Date(g.data));
        atualizar();
      }
    };

    function salvarLocal() {
      localStorage.setItem('meusGastos', JSON.stringify(gastos));
    }

    function formatarData(data) {
      const d = new Date(data);
      const dia = String(d.getDate()).padStart(2, '0');
      const mes = String(d.getMonth() + 1).padStart(2, '0');
      return `${dia}/${mes}`;
    }

    function adicionar() {
      const valorInput = document.getElementById('valor');
      const localInput = document.getElementById('local');
      const pagador = document.getElementById('pagador').value;
      const valor = parseFloat(valorInput.value);

      if (!valor || valor <= 0) return;

      gastos.push({
        valor,
        pagador,
        local: localInput.value,
        data: new Date()
      });

      valorInput.value = "";
      localInput.value = "";
      salvarLocal();
      atualizar();
    }

    function remover(index) {
      gastos.splice(index, 1);
      salvarLocal();
      atualizar();
    }

    function atualizar() {
      let total = 0;
      let m = 0;
      let s = 0;

      // Ordenação (Data + Nome)
      gastos.sort((a, b) => {
        const dataDiff = new Date(a.data).setHours(0, 0, 0, 0) - new Date(b.data).setHours(0, 0, 0, 0);
        if (dataDiff !== 0) return dataDiff;
        return a.pagador.localeCompare(b.pagador);
      });

      let listaHTML = "";
      let extratoCorpo = "";
      let ultimoDia = "";

      gastos.forEach((g, index) => {
        const dataFormatada = formatarData(g.data);

        if (dataFormatada !== ultimoDia) {
          if (ultimoDia !== "") extratoCorpo += "\n";
          listaHTML += `<div class="dia">${dataFormatada}</div>`;
          extratoCorpo += `*${dataFormatada}*\n`;
          ultimoDia = dataFormatada;
        }

        listaHTML += `
          <div class="item-gasto">
            <span>
              ${g.pagador} R$ ${g.valor.toFixed(2)} 
              ${g.local ? `| <span class="desc">${g.local}</span>` : ""}
            </span>
            <span class="btn-remover" onclick="remover(${index})">×</span>
          </div>
        `;

        extratoCorpo += `${g.pagador} R$ ${g.valor.toFixed(2)}${g.local ? " | " + g.local : ""}\n`;

        total += g.valor;
        if (g.pagador === "Michael") m += g.valor;
        else s += g.valor;
      });

      const metade = total / 2;

      let resumoWhatsApp = `\n*Total: R$ ${total.toFixed(2)}*\n`;
      resumoWhatsApp += `*Por pessoa: R$ ${metade.toFixed(2)}*\n\n`;

      let resumoFront = resumoWhatsApp.replace(/\*/g, '');

      if (m > metade) {
        const valorDevido = (m - metade).toFixed(2);
        resumoWhatsApp += `Steffany deve *R$ ${valorDevido}* para Michael\n\n`;
        resumoWhatsApp += `_*Pix Michael:*_ _CPF 438.505.178-02 (Banco Inter)_`;
        resumoFront += `Steffany deve R$ ${valorDevido} para Michael`;
      } else if (s > metade) {
        const valorDevido = (s - metade).toFixed(2);
        resumoWhatsApp += `Michael deve *R$ ${valorDevido}* para Steffany\n\n`;
        resumoWhatsApp += `_*Pix Steffany:*_ _E-mail steffanynobukawa2021@gmail.com_`;
        resumoFront += `Michael deve R$ ${valorDevido} para Steffany`;
      } else if (total > 0) {
        resumoFront += `Contas equilibradas!`;
        resumoWhatsApp += `Contas equilibradas!`;
      }

      document.getElementById('lista').innerHTML = listaHTML;
      document.getElementById('resultado').innerText = resumoFront;

      window.extratoFinal = extratoCorpo + resumoWhatsApp;
    }

    function copiar() {
      if (!window.extratoFinal || gastos.length === 0) return;
      const el = document.createElement('textarea');
      el.value = window.extratoFinal;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert("Extrato copiado!");
    }

    function limparTudo() {
      if (confirm("Deseja apagar todos os registros?")) {
        gastos = [];
        localStorage.removeItem('meusGastos');
        atualizar();
      }
    }
  </script>

</body>

</html>
